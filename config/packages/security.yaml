security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ✅ JWT Login Endpoint (correctly placed)
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # ✅ JWT-protected API routes
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        # ✅ Your existing form-based firewall
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_login
                invalidate_session: true

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
         # ❌ Restrict access to book management and viewing to logged-in users
        - { path: ^/book, roles: ROLE_USER }

        # ❌ Borrow-related routes need ROLE_USER
        - { path: ^/borrow, roles: ROLE_USER }

        # ❌ Secure return routes
        - { path: ^/return, roles: ROLE_USER }

        # ✅ Allow anonymous users to access login and register
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # Optional: Allow static assets like CSS, images, etc.
        - { path: ^/assets, roles: PUBLIC_ACCESS }
